# ===================================================================
# 测试模式配置示例
# ===================================================================

# 实验基本信息
experiment_name: "resnet34_exp4_50_pda4"
seed: 42
device: "auto"

# 模式设置为测试
mode: "test"

# 数据路径
data_path: "/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_b12_50" 

# ===================================================================
# 测试模式配置
# ===================================================================
test_config:
  # 测试数据路径 
  test_data_path: "/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_b12_50/val" # "/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_b12_50_right_mean/val" #"/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_b12_50/val"
  
  # 模型权重路径
  model_checkpoint: "/storage/fdunphome/zhangjingzong/resnet-upc/experiments_b12/resnet34_exp4_50sum/checkpoints/best_multitask_gradnorm_model.pth"
  #model_checkpoint: "/storage/fdunphome/zhangjingzong/resnet-upc/experiments_plot/resnet34_exp4_50_inch2/checkpoints/best_multitask_gradnorm_model.pth"
  # 特征保存配置
  save_features:
    enabled: false                    # 开启特征保存
    output_dir: "features"          # 特征保存目录
    batch_size: 8                   # 测试批次大小（可以比训练时小）
    include_processed_images: true  # 保存预处理后的图像
    include_original_paths: true    # 保存原始文件路径
    
  # 结果保存
  save_predictions: false            # 保存预测结果
  save_plots: false                 # 保存结果图表

# ===================================================================
# 推理模式配置（需要与训练时保持一致）
# ===================================================================
inference_mode: "multitask_mlp"

# 多任务MLP配置（需要与训练时保持一致）
multitask_mlp_config:
  feature_dim: 256
  shared_dims: []
  regression_dims: [128, 32]
  regression_loss_type: "huber"
  classification_dims: [64]
  task_weights:
    regression: 3.0
    classification: 0.1
  dropout: 0.4

# ===================================================================
# 数据预处理配置（需要与训练时保持一致）
# ===================================================================
preprocessing:
  center_crop:
    enabled: true
    size: 224
  log_normalization:
    enabled: true
    epsilon: 0.000000001
  resize:
    enabled: true
    size: 224
  normalize:
    enabled: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: false

  gaussian_spatial_noise: 
    enabled: false
    factor: 0.01     # 这里设定倍率为 0.01
    scale: 0.0015503876


# ===================================================================
# 模型配置（需要与训练时保持一致）
# ===================================================================
model_config:
  resnet_pretrained: true
  dropout_rate: 0.1

# ===================================================================
# 输出配置
# ===================================================================
output_dir: "/storage/fdunphome/zhangjingzong/resnet-upc/experiments_plot2"
num_workers: 4

# ===================================================================
# 可解释性分析配置
# ===================================================================
interpretability:
  enabled: true
  
  # Grad-CAM配置
  gradcam:
    enabled: false                    # 开启Grad-CAM分析
    target_layers: ["feature_extractor.features.7"]        # 目标层（ResNet的最后一个卷积块）
    num_samples: -1                  # 分析的样本数量（-1表示所有样本）
    save_heatmaps: true             # 保存热力图
    save_overlay: true              # 保存叠加图
    colormap: "jet"                 # 热力图颜色方案
    alpha: 0.4                      # 叠加透明度
    output_dir: "gradcam"           # Grad-CAM输出目录
    
  pda:
    enabled: true
    output_dir: "pda_maps_paper"
    patch_size: 8              # [建议] 保持8或减小到4。越小细节越丰富，但过小可能无响应。
    stride: 4                  # [核心修改] 设为1：逐像素滑动，彻底消除马赛克方块感。
    num_conditional_samples: 10 # [核心修改] 3 -> 50：大幅增加采样，让热力图如丝般顺滑，消除噪点。
    sampling_mode: 'gaussian'  # 保持
    context_size: 3            # [微调] 稍微增大上下文，利用更多周边信息（视具体算法而定，可保持3）。
    internal_batch_size: 32    # [建议] 稍微降低。因为步长为1会生成海量遮挡图，降低batch防显存溢出。

    # === 新增：指定处理文件列表 ===
    # 请确保这些文件在 test_data_path 中存在
    target_files_regression: [
    #  "class1_val_sample_0059_beta2_0.0600_beta3_0.2000_files_24.npy",
    #  "class1_val_sample_0084_beta2_0.3000_beta3_0.0000_files_25.npy",
    #  "class2_val_sample_0000_beta2_0.0867_beta3_0.2000_files_23.npy",
    #  "class0_val_sample_0002_beta2_0.3000_beta3_0.0222_files_18.npy"
    "class2_val_sample_0000_beta2_0.0867_beta3_0.2000_files_23.npy"
    ]
    
    target_files_classification: [
    #  "class0_val_sample_0072_beta2_0.1400_beta3_0.1556_files_21.npy",
    #  "class0_val_sample_0090_beta2_0.1133_beta3_0.1333_files_21.npy",
    #  "class1_val_sample_0009_beta2_0.0600_beta3_0.0222_files_12.npy",
    "class0_val_sample_0090_beta2_0.1133_beta3_0.1333_files_21.npy",
    #  "class2_val_sample_0066_beta2_0.0600_beta3_0.0000_files_20.npy",
    #  "class2_val_sample_0005_beta2_0.2200_beta3_0.0000_files_23.npy"
    "class1_val_sample_0058_beta2_0.2467_beta3_0.0667_files_14.npy"
    ]

    # 任务特定分析
    task_specific:
      regression: true      
      classification: true 
    
    # 绘图样式参数
    p_limit: 0.17  # 坐标轴范围
    colormap:  "jet"   #"seismic"       # [论文建议] 推荐修改（见下文详解）。
    alpha: 0.7     # Overlay 透明度

    
    # 高级选项
    guided_backprop: false
    smooth_grad: false

# ===================================================================
# 其他必要配置（保持与训练时一致）
# ===================================================================
gradnorm:
  enabled: true
  alpha: 1.5
  lr: 0.025
  weight: 0.1



logging:
  level: "INFO"