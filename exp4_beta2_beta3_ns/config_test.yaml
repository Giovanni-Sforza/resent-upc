# ===================================================================
# 测试模式配置示例
# ===================================================================

# 实验基本信息
experiment_name: "resnet34_exp4_beta_regression_classification_50_cut_R2_2"
seed: 42
device: "auto"

# 模式设置为测试
mode: "test"

# 数据路径
data_path: "/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_50"

# ===================================================================
# 测试模式配置
# ===================================================================
test_config:
  # 测试数据路径 
  test_data_path: "/storage/fdunphome/zhangjingzong/resnet-upc/data_exp3/processed_sample_whs_50/val"
  
  # 模型权重路径
  model_checkpoint: "/storage/fdunphome/zhangjingzong/resnet-upc/experiments/resnet34_exp4_beta_regression_classification_50_cut_R2_2/checkpoints/best_multitask_gradnorm_model.pth"
  
  # 特征保存配置
  save_features:
    enabled: true                    # 开启特征保存
    output_dir: "features"          # 特征保存目录
    batch_size: 8                   # 测试批次大小（可以比训练时小）
    include_processed_images: true  # 保存预处理后的图像
    include_original_paths: true    # 保存原始文件路径
    
  # 结果保存
  save_predictions: true            # 保存预测结果
  save_plots: true                 # 保存结果图表

# ===================================================================
# 推理模式配置（需要与训练时保持一致）
# ===================================================================
inference_mode: "multitask_mlp"

# 多任务MLP配置（需要与训练时保持一致）
multitask_mlp_config:
  feature_dim: 256
  shared_dims: []
  regression_dims: [128, 32]
  regression_loss_type: "huber"
  classification_dims: [64]
  task_weights:
    regression: 3.0
    classification: 0.1
  dropout: 0.4

# ===================================================================
# 数据预处理配置（需要与训练时保持一致）
# ===================================================================
preprocessing:
  center_crop:
    enabled: true
    size: 224
  log_normalization:
    enabled: true
    epsilon: 0.000000001
  resize:
    enabled: true
    size: 224
  normalize:
    enabled: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: false

# ===================================================================
# 模型配置（需要与训练时保持一致）
# ===================================================================
model_config:
  resnet_pretrained: true
  dropout_rate: 0.1

# ===================================================================
# 输出配置
# ===================================================================
output_dir: "/storage/fdunphome/zhangjingzong/resnet-upc/experiments"
num_workers: 4

# ===================================================================
# 可解释性分析配置
# ===================================================================
interpretability:
  enabled: true
  
  # Grad-CAM配置
  gradcam:
    enabled: true                    # 开启Grad-CAM分析
    target_layers: ["feature_extractor.features.7"]        # 目标层（ResNet的最后一个卷积块）
    num_samples: -1                  # 分析的样本数量（-1表示所有样本）
    save_heatmaps: true             # 保存热力图
    save_overlay: true              # 保存叠加图
    colormap: "jet"                 # 热力图颜色方案
    alpha: 0.4                      # 叠加透明度
    output_dir: "gradcam"           # Grad-CAM输出目录
    
    # 任务特定分析
    task_specific:
      regression: true              # 对回归任务进行分析
      classification: true          # 对分类任务进行分析
    
    # 高级选项
    guided_backprop: false
    smooth_grad: false

# ===================================================================
# 其他必要配置（保持与训练时一致）
# ===================================================================
gradnorm:
  enabled: true
  alpha: 1.5
  lr: 0.025
  weight: 0.1

logging:
  level: "INFO"